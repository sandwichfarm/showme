[package]
name = "showme"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
default-run = "showme"
authors = ["sandwich <bread@sandwich.farm>"]
description = "A powerful terminal image and video viewer supporting multiple formats and rendering backends"
repository = "https://github.com/sandwichfarm/showme"
homepage = "https://github.com/sandwichfarm/showme"
documentation = "https://docs.rs/showme"
readme = "README.md"
license = "GPL-2.0"
keywords = ["terminal", "image", "video", "viewer", "media"]
categories = ["command-line-utilities", "multimedia::images", "multimedia::video"]

[[bin]]
name = "showme"
path = "src/main.rs"

[[bin]]
name = "ascii-title"
path = "src/bin/ascii_title.rs"

[features]
default = ["unicode", "kitty", "iterm2", "video", "qoi", "pdf", "svg"]
unicode = []
kitty = []
sixel = ["dep:sixel-sys"]
iterm2 = []
video = ["dep:ffmpeg-next"]
qoi = ["dep:qoi"]
pdf = ["dep:pdfium-render"]
svg = ["dep:resvg", "dep:flate2"]

[dependencies]
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3.5.2"
# 1.0.0 introduces zip 0.6.6, affected by RUSTSEC-2026-0367/0368/0369.
# Retain the ZIP-free implementation until upstream updates its ZIP dependency.
figlet-rs = "=1.0.0"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "tga",
    "tiff",
    "webp",
] }
rayon = "1.8"
thiserror = "2.0"
libc = "0.2"

[dependencies.sixel-sys]
version = "0.5"
optional = true

[dependencies.ffmpeg-next]
version = "9.0"
optional = true
default-features = false
features = ["format", "software-scaling"]

[dependencies.qoi]
version = "0.4"
optional = true

[dependencies.pdfium-render]
version = "0.9"
optional = true
default-features = false
features = ["pdfium_7881", "image_025", "thread_safe"]

[dependencies.flate2]
version = "1.1"
optional = true

[dependencies.resvg]
version = "0.48"
optional = true

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
