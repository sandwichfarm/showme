name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag and manifest agreement
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish_crate.py --tag "$RELEASE_TAG"

  verify:
    needs: version
    uses: ./.github/workflows/verify.yml

  binaries:
    needs: verify
    uses: ./.github/workflows/artifacts.yml

  publish-crate:
    needs: [verify, binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: x86_64-unknown-linux-gnu
          features: unicode,kitty,iterm2,qoi,pdf,svg,video
      - name: Publish or verify identical existing package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish_crate.py --tag "$RELEASE_TAG" --publish

  create-release:
    needs: [verify, binaries, publish-crate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: showme-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body_path: docs/runtime.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
