name: Verify

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  audit:
    uses: ./.github/workflows/security.yml

  test:
    name: Test ${{ matrix.target }} (${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust: stable
            features: unicode,kitty,iterm2,qoi,pdf,svg,video,sixel
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust: stable
            features: unicode,kitty,iterm2,qoi,pdf,svg,video
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rust: stable
            features: unicode,kitty,iterm2,qoi,pdf,svg,video
          - os: macos-15
            target: aarch64-apple-darwin
            rust: stable
            features: unicode,kitty,iterm2,qoi,pdf,svg,video
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rust: stable
            features: unicode,kitty,iterm2,qoi,pdf,svg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust: '1.92.0'
            features: unicode,kitty,iterm2,qoi,pdf,svg,video,sixel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          features: ${{ matrix.features }}
      # Cache downloads only: every job compiles into an empty target directory.
      - name: Cache feature identity
        id: cache-features
        env:
          TEST_FEATURES: ${{ matrix.features }}
        run: echo "value=${TEST_FEATURES//,/-}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ matrix.rust }}-${{ steps.cache-features.outputs.value }}-${{ hashFiles('Cargo.lock') }}
      - name: Portable media features
        run: cargo test --locked --no-default-features --features unicode,kitty,iterm2,qoi,pdf,svg -- --include-ignored
      - name: Advertised native features
        env:
          TEST_FEATURES: ${{ matrix.features }}
        run: cargo test --locked --no-default-features --features "$TEST_FEATURES" -- --include-ignored
      - name: Minimal build
        run: cargo test --locked --no-default-features --features unicode,kitty,iterm2

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: x86_64-unknown-linux-gnu
          features: unicode,kitty,iterm2,qoi,pdf,svg,video,sixel
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --features unicode,kitty,iterm2 --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --features unicode --all-targets -- -D warnings
      - run: cargo check --locked --examples --all-features
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Pinned workflow linter
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: x86_64-unknown-linux-gnu
          features: unicode,kitty,iterm2,qoi,pdf,svg,video,sixel
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: rustup component add llvm-tools-preview
      - run: cargo llvm-cov --locked --all-features --json --output-path coverage.json -- --include-ignored
      - run: python3 scripts/check_coverage.py coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: error
